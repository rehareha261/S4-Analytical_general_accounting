<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choix du Journal</title>
</head>
<body>
    <h1>Choix du Journal</h1>
    <!-- Form selection for report export -->
    <form action="/export_report" method="POST">
        <label for="report_type">Type de Rapport:</label>
        <select id="report_type" name="report_type">
            <option value="financial_statement">État Financier</option>
            <option value="journal_entries">Écritures de Journal</option>
        </select>
        
        <label for="format">Format:</label>
        <select id="format" name="format">
            <option value="pdf">PDF</option>
            <option value="excel">Excel</option>
        </select>
        
        <button type="submit">Exporter</button>
    </form>
</body>
</html>
